services:
  postgres-payment:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=payments_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "5433:5432"
  postgres-order:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=orders_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "5431:5432"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672" 
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    deploy:
      resources:
        limits:
          memory: 512M
      
  payment-service:
    build: ./PaymentsService
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081

  order-service:
    build: ./OrdersService
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082

  gateway:
    build: ./GateWay
    ports:
      - "8080:8080"
    depends_on:
      - payment-service
      - order-service
    environment:
      - SERVER_PORT=8080